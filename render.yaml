services:
  - type: web
    name: omma-stitch-service
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MAX_IMAGES
        value: 30
      - key: MAX_PAYLOAD_MB
        value: 100
      - key: JPEG_QUALITY
        value: 85
      - key: OMMA_API_KEY
        value: ""
